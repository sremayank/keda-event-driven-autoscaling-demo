name: Kind Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    name: Deploy demo to kind
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up kind
        uses: helm/kind-action@v1
        with:
          cluster_name: keda-demo

      - name: Install KEDA
        run: |
          helm repo add kedacore https://kedacore.github.io/charts
          helm repo update
          helm install keda kedacore/keda --namespace keda --create-namespace --wait

      - name: Build and load demo image
        run: |
          docker build -t keda-redis-worker:0.1.0 ./app
          kind load docker-image keda-redis-worker:0.1.0 --name keda-demo

      - name: Deploy Redis, worker, and scaler
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/redis.yaml
          kubectl apply -f k8s/worker.yaml
          kubectl apply -f k8s/scaledobject.yaml

      - name: Wait for Redis
        run: kubectl -n keda-demo rollout status deploy/redis --timeout=120s

      - name: Wait for worker deployment
        run: kubectl -n keda-demo rollout status deploy/keda-worker --timeout=120s

      - name: Verify KEDA resources
        run: |
          kubectl -n keda-demo get scaledobject redis-queue-worker
          for attempt in {1..30}; do
            if kubectl -n keda-demo get hpa keda-hpa-redis-queue-worker; then
              exit 0
            fi
            sleep 2
          done
          kubectl -n keda-demo get hpa
          exit 1

      - name: Run producer job
        run: kubectl apply -f k8s/producer-job.yaml

      - name: Wait for producer job
        run: kubectl -n keda-demo wait --for=condition=complete job/keda-producer --timeout=120s

      - name: Show final state
        if: always()
        run: |
          kubectl -n keda-demo get pods,hpa,scaledobject
          kubectl -n keda-demo logs job/keda-producer || true
