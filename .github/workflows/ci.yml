name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate demo
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m py_compile app/producer.py app/worker.py

      - name: Validate YAML syntax
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in sorted(Path("k8s").glob("*.yaml")):
              with path.open() as handle:
                  list(yaml.safe_load_all(handle))
              print(f"validated {path}")
          PY

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Render Kubernetes manifests
        run: kubectl kustomize k8s > /tmp/keda-demo.yaml

      - name: Validate Kubernetes schemas
        run: |
          kubectl kustomize k8s \
            | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 \
                -strict \
                -ignore-missing-schemas \
                -summary \
                -kubernetes-version 1.29.0 \
                -

      - name: Build worker image
        run: docker build -t keda-redis-worker:ci ./app
